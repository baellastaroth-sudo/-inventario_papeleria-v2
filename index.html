<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papeleria Local</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <div id="inicial">
            <h3>Seleccionar Formulario</h3>
            <button onclick="showForm('idregistro')">Formulario de Registro</button>
            <button onclick="showForm('venta')">Formulario de Ventas</button>
        </div>
        
        <!-- FORMULARIO DE REGISTRO -->
        <div id="idregistro" class="formulario" style="display: none;">
            <h3>📋 Formulario de Registro</h3>
            <div class="fila"><label>Código:</label><input type="text" id="codigo" placeholder="Ej: PAP-001"></div>
            <div class="fila"><label>Nombre:</label><input type="text" id="nombre" placeholder="Ej: Cuaderno"></div>
            <div class="fila"><label>Precio Unitario ($):</label><input type="number" id="precio" placeholder="0.00" step="0.01" min="0"></div>
            <div class="fila"><label>Cantidad:</label><input type="number" id="cantidad" placeholder="0" min="0"></div>
            
            <div class="botones-accion">
                <button id="btnAgregar">➕ Agregar Producto</button>
                <button id="btnLimpiar">🧹 Limpiar Formulario</button>
            </div>
            
            <div class="tabla-contenedor">
                <table id="tablaProductos">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Precio Unit.</th>
                            <th>Cantidad</th>
                            <th>Total Producto</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        <tr class="fila-vacia"><td colspan="5">No hay productos registrados</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- FORMULARIO DE VENTAS (IDs CORREGIDOS) -->
        <div id="venta" class="formulario" style="display: none;">
            <h3>💰 Formulario de Ventas</h3>
            <div class="fila"><label>Producto:</label><input type="text" id="productoVenta" placeholder="Ej: Cuaderno" autocomplete="off"></div>
            <div class="fila"><label>Descuento ($):</label><input type="number" id="descuentoVenta" placeholder="0.00" step="0.01" min="0"></div>
            <div class="fila"><label>IVA (%):</label><input type="number" id="ivaPorcentaje" placeholder="0.00" step="0.01" min="0"></div> 
            
            <div class="botones-accion">
                <button id="btnAgregarVenta">➕ Agregar a Venta</button>
                <button id="btnLimpiarVenta">🧹 Limpiar Formulario</button>
            </div>
            
            <div class="tabla-contenedor">
                <table id="tablaVentas">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Descuento</th>
                            <th>IVA</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaVenta">
                        <tr class="fila-vacia"><td colspan="4">No hay productos en la venta actual</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
